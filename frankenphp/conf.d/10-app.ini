expose_php = 0
date.timezone = UTC
apc.enable_cli = 1
session.use_strict_mode = 1
zend.detect_unicode = 0

; Uploads des photos de livres (voir BookItemType : 5 photos max, 10 Mo chacune)
; upload_max_filesize : taille max d'UN fichier (doit être >= la contrainte Image du formulaire)
; post_max_size       : taille max de TOUTE la requête (toutes les photos de tous les livres du pack)
; max_file_uploads    : nombre max de fichiers par requête (20 par défaut, trop peu pour un pack)
upload_max_filesize = 10M
post_max_size = 100M
max_file_uploads = 100

; https://symfony.com/doc/current/performance.html
realpath_cache_size = 4096K
realpath_cache_ttl = 600
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 32531
opcache.memory_consumption = 256
opcache.enable_file_override = 1
