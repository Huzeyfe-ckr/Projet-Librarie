---
name: CI

on:
  push:
    branches:
      - main
  pull_request: ~
  workflow_dispatch: ~

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker images
        uses: docker/bake-action@v7
        with:
          pull: true
          load: true
          source: .
          files: |
            compose.yaml
            compose.override.yaml
          set: |
            *.cache-from=type=gha,scope=${{github.ref}}
            *.cache-from=type=gha,scope=refs/heads/main
            *.cache-to=type=gha,scope=${{github.ref}},mode=max
      - name: Start services
        run: docker compose up --wait --no-build
      - name: Check HTTP reachability
        run: curl -v --fail-with-body http://localhost
      - name: Check Mercure reachability
        run: curl -vI --insecure --fail-with-body https://localhost/.well-known/mercure?topic=test
      - name: Symfony lint (YAML, Twig, container)
        run: |
          docker compose exec -T php bin/console lint:yaml config --parse-tags
          docker compose exec -T php bin/console lint:twig templates
          docker compose exec -T php bin/console lint:container
      # Décommente ces étapes quand la base de test fonctionne dans la CI
      # - name: Create test database
      #   run: docker compose exec -T php bin/console -e test doctrine:database:create
      # - name: Run migrations
      #   run: docker compose exec -T php bin/console -e test doctrine:migrations:migrate --no-interaction
      # - name: Doctrine Schema Validator
      #   run: docker compose exec -T php bin/console -e test doctrine:schema:validate
      # - name: Run PHPUnit
      #   run: docker compose exec -T php bin/phpunit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Lint Code Base
        uses: super-linter/super-linter/slim@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_CHECKOV: false
          VALIDATE_TRIVY: false
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_BIOME_LINT: false
          VALIDATE_PYTHON_BLACK: false
          # Ces linters lancent `composer install` dans un conteneur PHP 8.4
          # sans ext-xml, alors que le projet exige PHP >= 8.5.9
          VALIDATE_PHP_PHPSTAN: false
          VALIDATE_PHP_PSALM: false